# HTTPS at the reference edge (ADR-026).
#
#   ./scripts/generate_dev_cert.sh
#   docker compose -f compose.yaml -f compose.edge.yaml -f compose.tls.yaml up -d --build
#   curl -k https://localhost:8443/v1/chat/completions ...
#
# Layered on top of compose.edge.yaml rather than replacing it, so the rate,
# connection and body limits are defined in exactly one place and TLS is
# additive. Bring up compose.edge.yaml alone for plain HTTP.
#
# ## The certificate is a runtime mount, always
#
# Nothing in this repository and nothing in any image layer contains a key. The
# development pair is generated by a script into deploy/certs/, which is
# gitignored as a directory and excluded from every build context. A production
# deployment mounts its own material at the same paths — from a secret manager,
# an ingress controller, cert-manager, or whatever issues its certificates.
#
# ## Fail closed
#
# The edge validates the certificate and key at start-up: present, readable,
# parseable, matching, unexpired. Any failure and the container exits rather than
# serving plaintext.

name: llm-firewall

services:
  edge:
    ports:
      # 8443 rather than 443: the container binds unprivileged ports so it can
      # drop every capability. A production host publishes 443 -> 8443.
      - "8443:8443"
    environment:
      EDGE_TLS_MODE: "on"
      EDGE_TLS_CERT: /etc/nginx/tls/fullchain.pem
      EDGE_TLS_KEY: /etc/nginx/tls/privkey.pem
      # Used to build the HTTP -> HTTPS redirect target, so it must be the port
      # a client actually reaches, not the container's.
      EDGE_TLS_PUBLIC_PORT: "8443"
    volumes:
      # Read-only, and the whole directory rather than two bind mounts so a
      # rotated pair swaps atomically from the host's point of view.
      - ./deploy/certs:/etc/nginx/tls:ro
    healthcheck:
      # Deliberately the PLAIN listener. A health check that follows the redirect
      # to a self-signed certificate fails for a reason that has nothing to do
      # with the edge's health, and `--no-check-certificate` in a health check is
      # a habit that outlives development.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  firewall-api:
    environment:
      # The application now REQUIRES a trusted proxy to say the browser hop was
      # HTTPS before it will serve the operator or caller surfaces (ADR-026).
      FIREWALL_HTTPS_ENFORCED: "true"
