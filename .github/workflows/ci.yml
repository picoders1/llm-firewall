name: CI

# Every job is blocking. A pipeline with advisory jobs trains people to ignore it.
# Design: docs/18-ci-cd-strategy.md
#
# No deployment, and no secrets: this pipeline builds, tests and scans. Deployment
# credentials would make every fork's CI a credential-exposure surface, and the
# suite needs no provider key to run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  UV_VERSION: "0.12.5"
  PYTHON_VERSION: "3.12"

# Feature branches cancel in progress; `main` never does.
#
# A push to `main` used to cancel the run already validating the previous commit,
# and the jobs it killed were exactly the slow ones that produce release
# evidence — container build, Trivy, TLS, integration, production topology. Run
# 32452165561 died that way with 7 green jobs and 4 cancelled, and the evidence
# upload then reported "No files were found", which reads like a scanner failure
# and is not one.
#
# Release evidence has to correspond to a COMPLETED validation of one exact
# commit, so on `main` a newer push queues behind the current run instead of
# killing it. Elsewhere fast feedback is worth more than a complete matrix.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lock-check:
    name: lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Keyed on the lockfile: a cache key that does not change when
          # dependencies change is how a "green" pipeline tests the wrong set.
          cache-dependency-glob: "uv.lock"
      # Catches pyproject.toml edited without re-locking.
      - run: uv lock --check

  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    name: type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-groups --frozen
      - run: uv run mypy app

  test:
    name: unit, api and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-groups --frozen
      - name: Run fast suites
        run: uv run pytest -m "unit or api or security" --cov=app --cov-report=term-missing
      - name: Security suite must not be empty
        # A green pipeline because the security tests silently stopped being
        # collected would be the worst possible failure mode here.
        run: |
          count=$(uv run pytest -m security --collect-only -q | tail -1)
          echo "collected: $count"
          uv run pytest -m security -q

  frontend:
    name: frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No package.json, no install, no lockfile: the console has no build step and
      # no dependencies, so its tests use node's built-in runner and nothing else
      # (ADR-022). Adding a package manager here to run 13 tests would introduce
      # the dependency surface the dashboard was designed to avoid.
      #
      # The explicit glob is load-bearing. `node --test tests/frontend/` resolves
      # the directory as a module on Node 22 and exits 1 before running anything --
      # which is why this job did not exist until Phase 19 found the documented
      # invocation was broken.
      - name: Formatter and DOM-safety tests
        run: node --test tests/frontend/*.test.mjs

  alerts:
    name: alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No stack and no Python needed: promtool evaluates the shipped rules
      # against synthetic series. Fast enough to run on every push, and it is the
      # only thing that can prove an alert stays SILENT when it should — which is
      # the half of alerting that rots unnoticed (ADR-031).
      - name: Validate the rule syntax
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/alerts:/rules:ro" prom/prometheus:v3.5.0 \
            check rules /rules/firewall.rules.yaml

      - name: Evaluate every alert against its unit tests
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/alerts:/rules:ro" prom/prometheus:v3.5.0 \
            test rules /rules/firewall.rules.test.yaml

  security:
    name: dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-groups --frozen
      - name: Known vulnerabilities in pinned dependencies
        # --skip-editable: this project itself is installed editable and is not on
        # PyPI, so it cannot be audited. --strict is NOT used because it fails on
        # any skip, including that one, which would make the job fail for a
        # reason unrelated to security. pip-audit still exits non-zero when a
        # vulnerability is found, which is the gate we actually want, and no
        # vulnerability is ignored.
        run: uv run pip-audit --skip-editable
      - name: Bandit security rules
        run: uv run ruff check --select S --output-format=github .
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: container build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, types, test]
    # `cache-to: type=gha` writes to the Actions Cache service, which needs
    # actions:write. Without this the build aborts in seconds on a 403, before
    # any layer is built — a failure that reads like a broken Dockerfile.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: llm-firewall:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The identifier of the artefact everything below actually inspects. Without
      # it the scan result names a mutable local tag and cannot be tied to a
      # commit after the fact, which makes it evidence of nothing.
      - name: Record the release-candidate image identity
        run: |
          {
            echo "commit:     ${{ github.sha }}"
            echo "workflow:   ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "dockerfile: deploy/docker/Dockerfile"
            echo "image_id:   ${{ steps.build.outputs.imageid }}"
            echo "digest:     ${{ steps.build.outputs.digest }}"
            echo "inspected:  $(docker image inspect --format '{{.Id}}' llm-firewall:ci)"
          } | tee image-identity.txt

      - name: Image must not contain secrets, tests or build tools
        run: |
          docker run --rm --entrypoint sh llm-firewall:ci -c '
            test ! -e /app/.env      || { echo "FAIL: .env in image"; exit 1; }
            test ! -e /app/tests     || { echo "FAIL: tests in image"; exit 1; }
            test ! -e /app/.git      || { echo "FAIL: .git in image"; exit 1; }
            test ! -e /app/artifacts || { echo "FAIL: checkpoints in image"; exit 1; }
            ! command -v gcc >/dev/null || { echo "FAIL: compiler in runtime"; exit 1; }
            test "$(id -u)" != "0"   || { echo "FAIL: running as root"; exit 1; }
            echo OK'

      # Phase 18 found 17 MB of per-sample benchmark rows shipping in this image:
      # the .dockerignore excluded `predictions*`, and the harness had started
      # writing `raw_results.jsonl`. The allow-list that replaced it is asserted
      # here against the built artefact rather than against the ignore file,
      # because the ignore file is what was wrong (R-92).
      - name: Image must carry only the evaluation summaries the console opens
        run: |
          stray=$(docker run --rm --entrypoint sh llm-firewall:ci -c \
            'find /app/eval -type f ! -name result.json 2>/dev/null')
          if [ -n "$stray" ]; then
            echo "FAIL: non-summary evaluation artefacts in the image:"; echo "$stray"; exit 1
          fi
          docker run --rm --entrypoint sh llm-firewall:ci -c \
            'echo "result.json files: $(find /app/eval -name result.json | wc -l)"'

      - name: Boot the container and check /health
        run: |
          docker run -d --name firewall -p 8000:8000 \
            -e FIREWALL_ENVIRONMENT=development \
            -e FIREWALL_PERSIST_EVENTS=false \
            llm-firewall:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/ready  | tee /dev/stderr | grep -q '"status":"ready"'
          docker rm -f firewall

      # Policy unchanged from docs/18-ci-cd-strategy.md: HIGH/CRITICAL fails the
      # build, unfixed findings are excluded because there is no action to take on
      # them. Phase 19 adds only the report file and its retention -- a scan whose
      # result exists solely in an expiring job log is not release evidence.
      # Pinned to the v0.36.0 commit, not to a tag: this is the security scanner,
      # and a tag can be moved under it. The previous reference was
      # `aquasecurity/trivy-action@0.28.0`, which has never existed — the tag is
      # `v0.28.0`, with the `v`. GitHub could not resolve it, so the job died at
      # workflow resolution and **the scan never started**. The policy below is
      # unchanged (ADR-033).
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-firewall:ci
          format: table
          output: trivy-image-report.txt
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Show the scan result
        if: always()
        run: cat trivy-image-report.txt || echo "(no report produced)"

      # The edge is the container on the public internet and nothing scanned it
      # until Phase 19, which found 21 HIGH CVEs in it including nghttp2 — the
      # library serving the HTTP/2 it terminates. Same policy as the application
      # image; there is no reason the ingress should be held to a looser one.
      - name: Build the reference edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.edge
          tags: llm-firewall-edge:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the edge image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-firewall-edge:ci
          format: table
          output: trivy-edge-report.txt
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Show the edge scan result
        if: always()
        run: cat trivy-edge-report.txt || echo "(no report produced)"

      # `always()`: the report matters most on the run where the gate failed.
      - name: Retain the release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            image-identity.txt
            trivy-image-report.txt
            trivy-edge-report.txt
          retention-days: 90
          if-no-files-found: warn

  tls:
    name: TLS integration
    runs-on: ubuntu-latest
    needs: [lint, types, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-groups --frozen

      # Generated per run into a gitignored directory. No certificate or key in
      # the repository, in an image layer, or in this file (ADR-026 §4).
      - name: Generate a development certificate
        run: ./scripts/generate_dev_cert.sh

      - name: Start the stack with TLS at the edge
        run: |
          docker compose -f compose.yaml -f compose.edge.yaml -f compose.tls.yaml \
            up -d --build

      - name: Wait for the TLS listener
        run: |
          for i in $(seq 1 45); do
            if curl -fsS --cacert deploy/certs/fullchain.pem \
                 https://localhost:8443/health >/dev/null 2>&1; then
              echo "TLS edge ready after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "TLS edge did not become ready"
          docker compose -f compose.yaml -f compose.edge.yaml -f compose.tls.yaml logs edge
          exit 1

      # Real handshakes: protocol floor, certificate/hostname match, redirect,
      # ALPN, and the auth boundaries over HTTPS.
      - name: Run the TLS suites
        run: |
          uv run pytest tests/integration/test_tls_edge.py \
                        tests/integration/test_tls_failure_modes.py -q

      - name: Prove no key reached the image
        run: |
          # A key baked into a layer survives every `docker rmi` of the container
          # and is readable by anyone who can pull the image.
          if docker run --rm --entrypoint sh llm-firewall-edge:dev -c \
               'ls /etc/nginx/tls 2>/dev/null | grep -q . && echo FOUND || true' | grep -q FOUND; then
            echo "certificate material found inside the image"; exit 1
          fi
          echo "no certificate material in the edge image"

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.edge.yaml -f compose.tls.yaml logs

      - name: Tear down
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.edge.yaml -f compose.tls.yaml down -v
          rm -rf deploy/certs

  deployment:
    name: production topology
    runs-on: ubuntu-latest
    needs: [lint, types, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-groups --frozen

      # Both generated per run into gitignored directories. No certificate, key
      # or credential is in the repository or in this file (ADR-026, ADR-028).
      - name: Generate certificate and secrets
        run: |
          ./scripts/generate_dev_cert.sh
          out=$(./scripts/init_prod_secrets.sh)
          echo "$out" | grep -v '^ *fw-'
          raw=$(echo "$out" | grep -oE 'fw-[A-Za-z0-9_-]+' | head -1)
          echo "::add-mask::$raw"
          echo "PROD_CALLER_KEY=$raw" >> "$GITHUB_ENV"

      - name: Bring up the production topology
        run: |
          docker compose -f compose.prod.yaml -f compose.prod-selftest.yaml \
            --env-file prod.selftest.env up -d --build

      - name: Wait for the edge
        run: |
          for i in $(seq 1 45); do
            if curl -fsS --cacert deploy/certs/fullchain.pem \
                 https://localhost:8443/health >/dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "production stack did not become ready"
          docker compose -f compose.prod.yaml -f compose.prod-selftest.yaml \
            --env-file prod.selftest.env logs
          exit 1

      - name: Apply migrations as a separate step
        run: |
          docker compose -f compose.prod.yaml --env-file prod.selftest.env \
            --profile migrate run --rm migrate

      # Probes the RUNNING stack: a manifest can be correct while a stale
      # container still holds a binding.
      - name: Probe the topology
        run: uv run pytest tests/integration/test_prod_topology.py -q

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f compose.prod.yaml -f compose.prod-selftest.yaml \
            --env-file prod.selftest.env logs

      - name: Tear down
        if: always()
        run: |
          docker compose -f compose.prod.yaml -f compose.prod-selftest.yaml \
            --env-file prod.selftest.env down -v
          rm -rf deploy/certs deploy/secrets

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: [lint, types, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-groups --frozen

      - name: Start the stack, including the reference edge
        run: >-
          docker compose -f compose.yaml -f compose.edge.yaml
          -f compose.observability.yaml up -d --build

      # The loop used to discard curl's error, so a timeout could not be told
      # apart from a refused connection, a 404, or a 503 from a required
      # readiness check. Run 32452271962 failed here with the gateway visibly
      # healthy — serving /health to the edge and /metrics to Prometheus — and
      # the log said nothing about why the runner could not reach it.
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ready >/dev/null 2>&1; then
              echo "ready after $((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::the gateway never became ready on localhost:8000"
          echo "--- last curl attempt, verbose ---"
          curl -sS -o /tmp/ready.out -w 'http_code=%{http_code} exitcode=%{exitcode} connect=%{time_connect}s\n' \
            http://localhost:8000/ready || echo "curl exit=$?"
          echo "--- body ---"; head -c 2000 /tmp/ready.out || true
          echo "--- container state and published ports ---"
          docker compose -f compose.yaml -f compose.edge.yaml -f compose.observability.yaml ps || true
          echo "--- host listeners ---"; ss -ltnp || true
          docker compose -f compose.yaml -f compose.edge.yaml -f compose.observability.yaml logs
          exit 1

      - name: Wait for the edge
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8089/health >/dev/null 2>&1; then
              echo "edge ready after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "edge did not become ready"
          docker compose -f compose.yaml -f compose.edge.yaml logs edge
          exit 1

      # R-87: the gateway advertised OpenMetrics and served the text format, so
      # every scrape failed and no alert could ever have fired. Nothing in the
      # Python suite noticed, because none of it is a Prometheus. This is the
      # regression guard, and it belongs in CI for exactly that reason.
      - name: Wait for Prometheus to scrape the gateway
        run: |
          for i in $(seq 1 30); do
            health=$(curl -fsS 'http://localhost:9091/api/v1/targets' \
              | python3 -c "import sys,json;t=json.load(sys.stdin)['data']['activeTargets'];print(next((x['health'] for x in t if x['labels']['job']=='llm-firewall'),'absent'))" 2>/dev/null || echo pending)
            if [ "$health" = "up" ]; then echo "scrape healthy after ${i} tries"; exit 0; fi
            sleep 2
          done
          echo "Prometheus never scraped the gateway successfully"
          curl -s 'http://localhost:9091/api/v1/targets' || true
          exit 1

      - name: Verify the migration mechanism against a real database
        run: |
          docker compose exec -T \
            -e FIREWALL_DATABASE_URL=postgresql+asyncpg://firewall:firewall@postgres:5432/firewall \
            firewall-api alembic upgrade head

      # Two passes, because the suites want different stacks and running them
      # together would mean one of them lying. The first exercises the gateway as
      # every pre-Phase-10 integration test expects it: callers unauthenticated.
      - name: Run integration suite (edge up, callers unauthenticated)
        run: uv run pytest -m integration -q

      # The second turns caller authentication on and re-runs only the edge
      # suite, which is the one that cares. Without this the authenticated path
      # through the proxy would skip, and claiming CI coverage of it would be
      # false (docs/22-evidence-and-claims.md).
      - name: Provision a caller credential and re-run the edge suite
        run: |
          set -euo pipefail
          # Cleanup on EVERY exit path. Previously `rm -f .env` was the last line,
          # so a failing pytest left the digest on the runner for whatever ran
          # next. The credential is ephemeral and must behave like it.
          trap 'rm -f .env' EXIT

          out=$(uv run python scripts/generate_caller_key.py ci-app)
          # Matched by SHAPE, not by line number. This read lines 4 and 7 of a
          # human-readable report, which silently yields garbage the first time
          # that report gains a line — and the failure would look like a broken
          # auth boundary rather than a broken parser.
          raw=$(printf '%s\n' "$out" | grep -oE 'fw-[A-Za-z0-9_-]{20,}' | head -1)
          digest=$(printf '%s\n' "$out" | grep -oE 'ci-app:[0-9a-f]{64}' | head -1)
          if [ -z "$raw" ] || [ -z "$digest" ]; then
            echo "credential provisioning produced nothing usable"; exit 1
          fi
          echo "::add-mask::$raw"

          # `.env` is already an optional env_file for firewall-api and is
          # gitignored, so no new mechanism is introduced. The digest goes to the
          # gateway and the raw key to the test, exactly as a real deployment
          # splits them (ADR-024) — neither is ever written to the repository.
          printf 'FIREWALL_CALLER_AUTH_MODE=api_key\nFIREWALL_CALLER_API_KEYS=%s\n' "$digest" > .env

          # Same file set as the initial `up`, so recreating one service cannot
          # resolve to a different topology than the stack it rejoins.
          docker compose -f compose.yaml -f compose.edge.yaml -f compose.observability.yaml \
            up -d --no-deps --force-recreate --wait firewall-api

          # Prove the boundary actually came up before claiming to have tested it.
          # Without this a misconfiguration runs the "authenticated" suite against
          # an unauthenticated gateway and reports success — a false green on the
          # single property this step exists to demonstrate.
          enforced=$(curl -fsS http://localhost:8000/api/v1/system/status \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["caller_auth_enforced"])')
          if [ "$enforced" != "True" ]; then
            echo "caller authentication did not engage (caller_auth_enforced=$enforced)"; exit 1
          fi
          echo "caller boundary enforced; running the authenticated edge suite"

          EDGE_TEST_CALLER_KEY="$raw" uv run pytest tests/integration/test_edge_proxy.py -q

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.edge.yaml logs

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.edge.yaml down -v
