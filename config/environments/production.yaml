# Production overlay — non-secret deployment defaults.
#
# Secrets (FIREWALL_UPSTREAM_API_KEY, FIREWALL_DATABASE_URL) come from the
# platform's secret manager as environment variables. They are rejected here.
#
# Note that FIREWALL_ENVIRONMENT=production also changes behaviour in code:
# content_logging=full is downgraded to hash regardless of what is configured
# (docs/10-security-model.md).

log_level: INFO
log_format: json

content_logging: none

persist_events: true
# Audit-write failure does not fail the request by default: the security decision
# is unaffected by a database outage, only the record is lost (ADR-012). Set
# require_audit: true where a regulatory audit guarantee is needed.
require_audit: false

metrics_enabled: true

# Off by default. A security gateway must not ship telemetry to a third party
# without an explicit decision (ADR-008).
tracing_enabled: false

# Off: per-stage timings are a timing side channel an attacker could use to
# infer which detector fired.
expose_timing_headers: false

# Operator boundary (ADR-023). `console_auth_mode` is deliberately ABSENT rather
# than set to `proxy`: it already derives to `proxy` in production, so an overlay
# that someone edits, or forgets to ship, cannot turn the console open.
#
# `trusted_proxies` has no safe default and is not written here either — it is
# deployment-specific and belongs in FIREWALL_TRUSTED_PROXIES. The process refuses
# to start without it, which is the intended failure: a boundary that cannot name
# its proxy is not a boundary.
#
# HTTPS required (ADR-026). Since Phase 12 this does more than emit HSTS: operator
# and gateway requests are refused with 426 unless a trusted proxy asserts the
# client's hop was TLS, and the process REFUSES TO START in production without it.
#
# It is set here rather than left derived because a production deployment that is
# not HTTPS is a bug, and the startup failure should name the setting an operator
# has to change. It also requires FIREWALL_TRUSTED_PROXIES, which is
# deployment-specific and belongs in the environment.
https_enforced: true

# Caller boundary (ADR-024). `caller_auth_mode` is ABSENT for the same reason as
# `console_auth_mode`: it derives to `api_key` in production, so an overlay that
# someone edits cannot turn `/v1` open, and `disabled` here is refused at startup.
#
# `caller_api_keys` is deployment-specific and belongs in the secret manager as
# FIREWALL_CALLER_API_KEYS. The process refuses to start without it — which is the
# intended failure: api_key mode with no keys would reject every caller while
# reporting itself protected.
#
# The rate limit is NOT set here. A number written into a checked-in overlay is a
# guess about someone else's traffic; size it from measured load and set it per
# deployment (R-63 — and note it is enforced per process, not globally).

# Admission control (ADR-025). Deliberately NOT set here.
#
# `max_concurrent_requests` depends on the instance's CPU budget and
# `auth_failures_per_minute` on whether callers have distinct addresses (R-65).
# A number written into a checked-in overlay is a guess about someone else's
# deployment; both belong in FIREWALL_* alongside the edge configuration that
# does the volumetric work.
