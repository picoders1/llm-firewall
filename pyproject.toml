[project]
name = "llm-firewall"
version = "0.1.0"
description = "A drop-in security gateway for OpenAI-compatible LLM endpoints."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "LLM Firewall contributors" }]
keywords = ["llm", "security", "prompt-injection", "gateway", "guardrails"]

# Runtime baseline, twelve packages (docs/adr/ADR-001-technology-stack.md).
# Every entry has a reason; heavy stacks live in optional extras below so the
# default image does not carry them.
dependencies = [
    "fastapi>=0.115,<1.0",           # ASGI framework, async-first
    "uvicorn[standard]>=0.30,<1.0",  # ASGI server
    "pydantic>=2.9,<3.0",            # domain types + request validation
    "pydantic-settings>=2.5,<3.0",   # environment configuration
    "httpx>=0.27,<1.0",              # pooled async upstream client (Phase 1)
    "structlog>=24.4,<26.0",         # structured logging with sink-level redaction
    "pyyaml>=6.0,<7.0",              # policy + environment overlay files
    "sqlalchemy[asyncio]>=2.0.35,<3.0",  # audit persistence
    "asyncpg>=0.29,<1.0",            # async PostgreSQL driver
    "alembic>=1.13,<2.0",            # schema migrations
    "prometheus-client>=0.21,<1.0",  # /metrics exposition
    "anyio>=4.4,<5.0",               # bounded thread offload for sync detectors
]

[project.optional-dependencies]
# Phase 2: transformer-based injection/jailbreak classifiers.
ml = [
    "transformers>=4.44,<5.0",
    "onnxruntime>=1.19,<2.0",
]
# Phase 2/3: Microsoft Presidio replaces the regex PII baseline.
pii = [
    "presidio-analyzer>=2.2,<3.0",
    "presidio-anonymizer>=2.2,<3.0",
    "spacy>=3.7,<4.0",
]
# Phase 4: evaluation harness metrics.
eval = [
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "respx>=0.21,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pip-audit>=2.7,<3.0",
    "types-pyyaml>=6.0,<7.0",
    "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "S",     # bandit / security
    "ASYNC", # async correctness — no blocking calls on the event loop
    "UP",    # pyupgrade
    "C4",    # comprehensions
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval", "services"]

[tool.ruff.lint.per-file-ignores]
# RUF001: this module's entire purpose is a table of Unicode confusables and
# invisible characters used for evasion. Flagging them as "ambiguous" is correct
# in general and exactly backwards here — the ambiguity is the subject matter.
# This is the only suppression of its kind in the codebase (ADR-010).
"app/core/normalize.py" = ["RUF001"]
# Same rationale: these tests assert that specific confusable and invisible
# characters are folded, so the fixtures must literally contain them.
"tests/unit/test_normalize.py" = ["RUF001", "RUF003"]
"tests/unit/test_redaction.py" = ["RUF001", "RUF003"]
"tests/unit/test_ids.py" = ["RUF001"]
"tests/security/test_slice_invariants.py" = ["RUF001"]
"tests/api/test_chat_completions.py" = ["RUF001"]
"tests/unit/test_baseline_detectors.py" = ["RUF001", "RUF003"]
"tests/evaluation/test_smoke_fixture.py" = ["RUF001"]
# Tests legitimately use assert, fake credentials, and fixture data.
"tests/**" = ["S101", "S105", "S106", "S311"]
"eval/**" = ["S101", "RUF001", "RUF002", "RUF003"]
# S603/S607: subprocess calls to known tools with fixed arguments.
# RUF001/RUF002: dataset builders deliberately contain Unicode confusables —
#   generating evasion variants is the subject matter, same rationale as ADR-010.
# S311: `random` seeds deterministic corpus generation, not cryptography; the
#   seed is pinned so the corpus rebuilds byte-identically.
"scripts/**" = ["S603", "S607", "RUF001", "RUF002", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/", "^build/"]

[[tool.mypy.overrides]]
module = ["tests.*", "eval.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "unit: pure logic, no I/O",
    "api: exercises the ASGI app in-process",
    "security: security-critical behaviour (block/redact/fail-closed/log-leak)",
    "integration: requires PostgreSQL and/or the containerised mock upstream",
    "evaluation: exercises the evaluation harness",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/observability/tracing.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
